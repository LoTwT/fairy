name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish workspace packages
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "Tag must be vX.Y.Z or vX.Y.Z-prerelease, got $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
          DATA_VERSION="$(node -p "require('./packages/data/package.json').version")"
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          COMMIT_SUBJECT="$(git log -1 --pretty=%s)"

          test "$ROOT_VERSION" = "$VERSION" || { echo "root package.json version $ROOT_VERSION != $VERSION" >&2; exit 1; }
          test "$CORE_VERSION" = "$VERSION" || { echo "packages/core package.json version $CORE_VERSION != $VERSION" >&2; exit 1; }
          test "$DATA_VERSION" = "$VERSION" || { echo "packages/data package.json version $DATA_VERSION != $VERSION" >&2; exit 1; }
          test "$CLI_VERSION" = "$VERSION" || { echo "packages/cli package.json version $CLI_VERSION != $VERSION" >&2; exit 1; }
          test "$COMMIT_SUBJECT" = "chore: release v$VERSION" || { echo "unexpected release commit: $COMMIT_SUBJECT" >&2; exit 1; }
          git fetch origin main:refs/remotes/origin/main --tags
          git merge-base --is-ancestor HEAD origin/main || { echo "release tag commit is not contained in origin/main" >&2; exit 1; }

          NPM_VERSION="$(npm --version)"
          node - "$NPM_VERSION" <<'NODE'
          const version = process.argv[2]
          const [major = 0, minor = 0, patch = 0] = version.split('.').map(Number)
          const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
          if (!ok) {
            console.error(`npm ${version} does not satisfy >= 11.5.1`)
            process.exit(1)
          }
          console.log(`npm ${version} satisfies >= 11.5.1`)
          NODE

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @randomplay/data verify:golden-v1
      - run: pnpm --filter @randomplay/data verify:mihoyo-da
      - run: pnpm --filter @randomplay/data verify:buhflipexplode-da
      - run: pnpm --filter @randomplay/data verify:excel
      - run: pnpm --silent fairy:s1 | jq empty
      - run: pnpm --silent fairy:s2 | jq empty
      - run: pnpm --silent fairy:s3 | jq empty

      - name: Publish packages to npm with trusted publishing
        run: |
          # pnpm -r publishes workspace packages in dependency order and
          # rewrites workspace:* dependencies to the release version.
          # Do NOT pass --provenance. npm Trusted Publishing generates the
          # provenance attestation server-side; the client flag triggers
          # TLOG_CREATE_ENTRY_ERROR.
          pnpm -r publish --access public --no-git-checks

      - name: Registry install smoke
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          cd "$TMP_DIR"
          npm init -y >/dev/null

          # npm CDN propagation usually completes in 10-60s after publish
          # but can tail into a few minutes. The first install attempt can
          # race with `ETARGET notarget`. Retry within a bounded budget:
          # 10 attempts x 30s delay = ~5 minutes total
          # (9 sleeps x 30s + per-attempt install time).
          #
          # Note: hitting the cap means propagation timed out, NOT that the
          # publish failed. Inspect `npm view <pkg>@${VERSION} version`
          # out-of-band before rerunning the job - if the versions exist, the
          # publish itself succeeded and only the smoke step needs a retry.
          MAX_ATTEMPTS=10
          DELAY=30
          ATTEMPT=1
          until npm install "@randomplay/core@$VERSION" "@randomplay/data@$VERSION" "@randomplay/cli@$VERSION" >/dev/null 2>&1; do
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "registry install smoke timed out after $MAX_ATTEMPTS attempts (~$((MAX_ATTEMPTS * DELAY))s). Publish may still have succeeded; verify with: npm view @randomplay/core@${VERSION} version && npm view @randomplay/data@${VERSION} version && npm view @randomplay/cli@${VERSION} version" >&2
              # Final attempt without redirect so the real error surfaces in logs.
              npm install "@randomplay/core@$VERSION" "@randomplay/data@$VERSION" "@randomplay/cli@$VERSION"
              exit 1
            fi
            echo "npm install attempt $ATTEMPT failed (likely npm CDN propagation lag); waiting ${DELAY}s before retry..."
            sleep "$DELAY"
            ATTEMPT=$((ATTEMPT + 1))
          done
          echo "npm install succeeded on attempt $ATTEMPT"

          node --input-type=module <<'NODE'
          import { calculate, parseBattleSnapshot } from '@randomplay/core'
          import * as data from '@randomplay/data'
          import replay from '@randomplay/data/cleaned/golden/v1-replay-report.json' with { type: 'json' }

          if (typeof calculate !== 'function') throw new Error('@randomplay/core calculate export missing')
          if (typeof parseBattleSnapshot !== 'function') throw new Error('@randomplay/core parseBattleSnapshot export missing')
          if (!Object.keys(data).length) throw new Error('@randomplay/data root export is empty')
          if (replay.summary?.releaseReady !== true) throw new Error('golden replay report is not release ready')
          NODE

          ./node_modules/.bin/fairy --help > help.json
          jq -e '.schemaVersion == "fairy-cli-help-v1" and (.commands | index("calc"))' help.json >/dev/null
          ./node_modules/.bin/fairy calc "$GITHUB_WORKSPACE/examples/snapshots/s1-yixuan-sheer.json" --lang zh | jq empty
          jq 'del(.attackSegments[0].source)' "$GITHUB_WORKSPACE/examples/snapshots/s1-yixuan-sheer.json" > warning-snapshot.json
          ./node_modules/.bin/fairy calc warning-snapshot.json --lang en > warning-output.json 2> warning-stderr.txt
          jq empty warning-output.json
          grep -q "ERR-SRC-001" warning-stderr.txt

      - name: Generate release notes
        run: npx --yes git-cliff@2.13.1 --latest --strip header --output /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: fairy v${{ steps.release.outputs.version }}
          body_path: /tmp/release-notes.md
          make_latest: true
