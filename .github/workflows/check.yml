name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24.11.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Enable the repository package manager
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source, tests, and packed packages
        run: pnpm check
      - name: Install browser acceptance runtime
        if: matrix.node == '24'
        run: pnpm --filter @randomplay/data exec playwright install --with-deps chromium
      - name: Verify Vite development and production consumption
        if: matrix.node == '24'
        run: pnpm --filter @randomplay/data verify:browser
